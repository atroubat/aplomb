name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include financial data, database files, exports, credentials, or personal information. Report security issues privately through the Security tab."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Use synthetic example values only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Device class
      options: [Phone, Tablet, Desktop, Not applicable]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and deployment method. Do not include private URLs or secrets.
