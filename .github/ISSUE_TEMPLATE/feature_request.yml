name: Feature request
description: Propose a focused improvement to Aplomb
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What budgeting problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and data impact
      description: Does this store, expose, import, or transmit any new data?
    validations:
      required: true
